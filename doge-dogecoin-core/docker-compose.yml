services:
  app_proxy:
    environment:
      APP_HOST: doge-dogecoin-core_web_1
      APP_PORT: 3000

  # One-shot: downloads the official Dogecoin Core release for this CPU
  # architecture and only installs it if its SHA-256 matches the pinned,
  # PGP-signed release checksum. Skips the download when already installed.
  fetch:
    image: python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
    user: "1000:1000"
    restart: on-failure
    environment:
      HOME: /tmp
      DOGECOIN_VERSION: "1.14.9"
    volumes:
      - ${APP_DATA_DIR}/fetch_dogecoin.py:/app/fetch_dogecoin.py:ro
      - ${APP_DATA_DIR}/data/bin:/opt/dogecoin
    command: ["python3", "-u", "/app/fetch_dogecoin.py"]

  dogecoind:
    image: python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
    user: "1000:1000"
    restart: on-failure
    init: true
    stop_grace_period: 3m
    depends_on:
      fetch:
        condition: service_completed_successfully
    environment:
      HOME: /data
    volumes:
      - ${APP_DATA_DIR}/data/bin:/opt/dogecoin:ro
      - ${APP_DATA_DIR}/data/dogecoin:/data
    entrypoint: ["/opt/dogecoin/1.14.9/bin/dogecoind"]
    command:
      - -datadir=/data
      - -printtoconsole
      - -server=1
      - -listen=1
      - -port=${APP_DOGECOIN_P2P_PORT}
      - -rpcport=${APP_DOGECOIN_RPC_PORT}
      - -rpcbind=0.0.0.0
      - -rpcallowip=${NETWORK_IP}/16
      - -rpcuser=${APP_DOGECOIN_RPC_USER}
      - -rpcpassword=${APP_DOGECOIN_RPC_PASS}
      - -rpcworkqueue=64
      - -rpcthreads=16
      - -dbcache=512
      - -maxconnections=64
      - -zmqpubhashblock=tcp://0.0.0.0:${APP_DOGECOIN_ZMQ_HASHBLOCK_PORT}
      - -zmqpubrawblock=tcp://0.0.0.0:${APP_DOGECOIN_ZMQ_RAWBLOCK_PORT}
      - -zmqpubrawtx=tcp://0.0.0.0:${APP_DOGECOIN_ZMQ_RAWTX_PORT}
      # The wallet page imports watch-only addresses only; never store keys here.
      - -keypool=1
    ports:
      # Dogecoin P2P. Forward this on your router for inbound peers.
      - "22556:22556/tcp"

  web:
    image: python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
    user: "1000:1000"
    restart: on-failure
    environment:
      HOME: /tmp
      PORT: "3000"
      APP_VERSION: "1.14.9"
      RPC_HOST: dogecoind
      RPC_PORT: ${APP_DOGECOIN_RPC_PORT}
      RPC_USER: ${APP_DOGECOIN_RPC_USER}
      RPC_PASS: ${APP_DOGECOIN_RPC_PASS}
      NODE_HOST: ${APP_DOGECOIN_NODE_IP}
      P2P_PORT: ${APP_DOGECOIN_P2P_PORT}
      ZMQ_HASHBLOCK_PORT: ${APP_DOGECOIN_ZMQ_HASHBLOCK_PORT}
      ZMQ_RAWBLOCK_PORT: ${APP_DOGECOIN_ZMQ_RAWBLOCK_PORT}
      ZMQ_RAWTX_PORT: ${APP_DOGECOIN_ZMQ_RAWTX_PORT}
      DEVICE_DOMAIN_NAME: ${DEVICE_DOMAIN_NAME}
    volumes:
      - ${APP_DATA_DIR}/dashboard.py:/app/dashboard.py:ro
      - ${APP_DATA_DIR}/wallet.py:/app/wallet.py:ro
      - ${APP_DATA_DIR}/walletkeys.py:/app/walletkeys.py:ro
      # Only the linked account's PUBLIC key and derived addresses live here.
      - ${APP_DATA_DIR}/data/walletui:/state
    command: ["python3", "-u", "/app/dashboard.py"]
